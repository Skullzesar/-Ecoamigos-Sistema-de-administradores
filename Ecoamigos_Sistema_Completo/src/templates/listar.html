<!-- Tabla para listar los administradores  -->
<main>
    {% include '_tabs.html' %}
    {% include '_mensajes.html' %}

    <div class="container mt-5">
        <h2>ADMINISTRADORES</h2>
        <div class="table-responsive">
            <table id="example" class="table table-striped table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>#</th>
                        <th>Identificación</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Celular</th>
                        <th>Opciones</th>
                    </tr>
                </thead>

                <tbody>
                    {% for usuario in usuarios %}
                    <tr>
                        <td>{{loop.index}}</td>
                        <!-- Genera una secuencia de numeración automática por cada registro -->
                        <td>{{usuario.id_admin}}</td>
                        <td>{{usuario.nombre}}</td>
                        <td>{{usuario.correo}}</td>
                        <td>{{usuario.celular}}</td>
                        <td>
                            <a href="{{ url_for('editar_admin', id_admin=usuario.id_admin) }}" class="btn btn-sm btn-warning">Editar</a>
                            <!-- Eliminar es POST (un enlace GET que borra datos es inseguro) -->
                            <form class="d-inline" method="POST"
                                  action="{{ url_for('eliminar_admin', id_admin=usuario.id_admin) }}"
                                  onsubmit='return confirm({{ ("¿Eliminar al administrador " ~ usuario.nombre ~ "?") | tojson }})'>
                                <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    {% include '_vendor_js.html' %}
    <script>
        // Espera a que jQuery y los plugins de DataTables estén cargados (CDN o copia local).
        ecoCargarVendor().then(function () {
            const tablaResultadosDataTable = $('#example').DataTable({
                responsive: true,
                "language": {
                    "lengthMenu": "Mostrar _MENU_ registros por página",
                    "zeroRecords": "No se encontraron registros",
                    "info": "Mostrando página _PAGE_ de _PAGES_",
                    "infoEmpty": "No hay registros disponibles",
                    "infoFiltered": "(filtrado de _MAX_ registros totales)",
                    "search": "Buscar:",
                    "paginate": {
                        "first": "Primero",
                        "last": "Último",
                        "next": "Siguiente",
                        "previous": "Anterior"
                    }
                },
                "paging": true, // Activar paginación
                "searching": true, // Mostrar la barra de búsqueda
                "lengthChange": true, // Mostrar la opción de cambiar el número de filas por página
                "info": true, // Mostrar la información del estado de la paginación
                "scrollY": "calc(70vh - 200px)", // Fijar la altura del área de desplazamiento
                "pagingType": "full_numbers" // Mostrar todas las paginaciones disponibles
            });
        }).catch(function (error) {
            // Si ni el CDN ni la copia local cargan, la tabla HTML simple sigue siendo visible.
            console.error("No se pudo cargar jQuery/DataTables:", error);
        });
    </script>
</main>
